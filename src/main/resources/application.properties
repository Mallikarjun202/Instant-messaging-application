# Local dev: copy application-local.properties.example to
# application-local.properties and fill in your database details.
# On Render, set SPRING_PROFILES_ACTIVE=secure plus the env vars listed in
# application-secure.properties.example.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# The app's own URL. CORS and the WebSocket endpoint accept only this origin.
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:8080}

# Session cookie is not sent on cross-site POSTs, which blocks CSRF
# (CSRF tokens are disabled because of the SockJS/STOMP setup).
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
